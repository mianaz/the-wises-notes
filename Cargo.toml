[package]
name = "sage-notes"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "贤者笔记 / The Wise's Notes: a handwriting notebook for the reMarkable Paper Pro in which young Hroptatyr answers in ink"

[[bin]]
name = "sage"
path = "src/main.rs"

[dependencies]
libc = "0.2"
signal-hook = "0.3"
png = "0.17"
ab_glyph = "0.2"
# HTTP + TLS for the OpenAI-compatible oracle backend. Pure Rust (rustls), no
# OpenSSL/C — keeps the binary self-contained and cross-compiles cleanly.
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[features]
# Link libquill.so (vendor e-ink engine C ABI) for full-takeover mode.
takeover = []

[profile.release]
strip = true
lto = true
